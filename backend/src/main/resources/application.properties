spring.application.name=backend

# Configuración de SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=das_ristorino;encrypt=false
spring.datasource.username=sa
spring.datasource.password=DB_Password
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Configuración del pool de conexiones
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# Configuración del servidor
server.port=8080

# Configuración de timezone (UTC-3, Buenos Aires)
# Nota: El formato de fechas se configura en WebConfig.java
spring.jackson.time-zone=America/Argentina/Buenos_Aires

# Logging para debugging
logging.level.org.springframework.jdbc=DEBUG
logging.level.com.zaxxer.hikari=DEBUG

# Logging de seguridad
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG
logging.level.ar.edu.ubp.das.backend.config=DEBUG

# Configuración JWT
security.jwt.secret=RISTORINO_BACKEND_2025_SEGURIDAD_SPRINGBOOT_SECRET_KEY

# WS-Security (SOAP)
ws.security.username=usr_admin
ws.security.password=pwd_admin

# OpenAI API Configuration
openai.api.key=${OPENAI_API_KEY:not-configured}
openai.model=gpt-5-nano
openai.timeout=${OPENAI_TIMEOUT:60}
openai.prompt.id=${OPENAI_PROMPT_ID:pmpt_68f93394cf6c8195955e0767742b9d7f05a21f383241fa79}
openai.prompt.busqueda.id=${OPENAI_PROMPT_BUSQUEDA_ID:pmpt_68f9295bc1e48194b2e725a7b5df2b1c0a01e67130022025}
