<div class="buscador-nlp">
  <form [formGroup]="buscarForm" (ngSubmit)="onSubmit()" class="d-flex gap-2">
    <div class="input-group flex-grow-1">
      <span class="input-group-text bg-white">
        <i class="bi bi-search text-muted"></i>
      </span>
      <input
        type="text"
        class="form-control"
        formControlName="consulta"
        placeholder="Buscar restaurantes con lenguaje natural..." i18n-placeholder
        autocomplete="off"
        [class.is-invalid]="consulta?.invalid && consulta?.touched">
    </div>
    <button 
      type="submit" 
      class="btn btn-primary"
      [disabled]="buscarForm.invalid"
      i18n>
      <i class="bi bi-search me-1"></i>
      <span class="d-none d-md-inline">Buscar</span>
    </button>
  </form>
  
  @if (consulta?.invalid && consulta?.touched) {
    <div class="invalid-feedback d-block mt-1">
      @if (consulta?.errors?.['required']) {
        <small class="text-danger" i18n>Por favor ingresa una búsqueda</small>
      }
      @if (consulta?.errors?.['maxlength']) {
        <small class="text-danger" i18n>La búsqueda no puede exceder 500 caracteres</small>
      }
    </div>
  }
</div>
