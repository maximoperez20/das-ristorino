<div id="cardsCarousel" class="carousel slide py-4 mx-auto w-75" data-bs-ride="carousel">
    <!-- Indicadores -->
    <div class="carousel-indicators">
        <button type="button" data-bs-target="#cardsCarousel" data-bs-slide-to="0" class="active" aria-current="true"
            aria-label="Slide 1"></button>
        <button type="button" data-bs-target="#cardsCarousel" data-bs-slide-to="1" aria-label="Slide 2"></button>
        <button type="button" data-bs-target="#cardsCarousel" data-bs-slide-to="2" aria-label="Slide 3"></button>
    </div>

    <!-- Slides -->
    <div class="carousel-inner">
        <!-- Slide 1 -->
        <div class="carousel-item active">
            <div class="row g-3 justify-content-center">
                @for (promocion of promocionesLista; track promocion.codigoPromocion) {
                <div class="col-10 col-md-4">
                    <div class="card h-100 shadow-sm">
                        <img [src]="promocion.imagenUrl" class="card-img-top" alt="{{ promocion.titulo }}" />
                        <div class="card-body">
                            <h5 class="card-title">{{ promocion.titulo }}</h5>
                            <p class="card-text text-truncate">{{ promocion.descripcion }}</p>
                            <p class="text-muted small mb-2">
                                Vigencia hasta: {{ promocion.fechaFin | date:'short' }}
                            </p>
                            <a class="btn btn-primary" (click)="registrarClickPromocion(promocion)"
                                [routerLink]="['/promociones', promocion.codigoPromocion]">
                                Ver promoción
                            </a>
                        </div>
                    </div>
                </div>
                } @empty {
                <div class="text-center py-4 text-muted">No hay promociones activas</div>
                }
            </div>
        </div>
    </div>

    <!-- Controles -->
    <button class="carousel-control-prev" type="button" data-bs-target="#cardsCarousel" data-bs-slide="prev"
        style="width: 3%;">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Anterior</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#cardsCarousel" data-bs-slide="next"
        style="width: 3%;">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Siguiente</span>
    </button>
</div>
