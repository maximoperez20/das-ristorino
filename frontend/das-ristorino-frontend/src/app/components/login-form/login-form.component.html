<form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="login-form">
  <div class="form-group">
    <label for="email">Correo</label>
    <input type="email" id="email" name="email" [(ngModel)]="email" required class="form-control" #emailInput="ngModel" />
    <div *ngIf="emailInput.invalid && (emailInput.dirty || emailInput.touched)" class="alert alert-danger">
      <div *ngIf="emailInput.errors?.['required']">El correo es requerido.</div>
      <div *ngIf="emailInput.errors?.['email']">Ingrese un correo válido.</div>
    </div>
  </div>

  <div class="form-group">
    <label for="password">Contraseña</label>
    <input type="password" id="password" name="password" [(ngModel)]="password" required minlength="6" class="form-control" #passwordInput="ngModel" />
    <div *ngIf="passwordInput.invalid && (passwordInput.dirty || passwordInput.touched)" class="alert alert-danger">
      <div *ngIf="passwordInput.errors?.['required']">La contraseña es requerida.</div>
      <div *ngIf="passwordInput.errors?.['minlength']">La contraseña debe tener al menos 6 caracteres.</div>
    </div>
  </div>

  <button type="submit" [disabled]="loginForm.invalid" class="btn btn-primary">Iniciar sesión</button>
</form>
